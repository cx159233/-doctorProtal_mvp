<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>患者档案"一屏看"交互时序图</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
        }

        /* Canvas Grid Background */
        .grid-bg {
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden text-slate-800 antialiased selection:bg-sky-100">

    <!-- Navigation / Top Control Bar -->
    <header class="bg-white border-b border-slate-200 px-5 py-3 flex items-center justify-between shrink-0 shadow-sm z-20">
        <div>
            <h1 class="text-base font-bold text-slate-900 leading-tight">患者档案"一屏看"交互时序图</h1>
        </div>

        <div class="flex items-center space-x-2">
            <button id="btnToggleSidebar" class="px-3 py-1.5 border border-slate-300 rounded-lg text-xs font-medium text-slate-700 hover:bg-slate-50 transition flex items-center space-x-1.5">
                <i class="fa-solid fa-list-check"></i>
                <span>步骤列表</span>
            </button>
            <button id="btnExportSVG" class="px-3.5 py-1.5 bg-slate-900 hover:bg-slate-800 text-white rounded-lg text-xs font-medium shadow transition flex items-center space-x-1.5">
                <i class="fa-solid fa-download"></i>
                <span>导出 PNG</span>
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex-1 flex overflow-hidden relative">

        <!-- Canvas Area -->
        <main id="canvasViewport" class="flex-1 relative overflow-hidden grid-bg cursor-grab active:cursor-grabbing">

            <!-- Canvas Floating Zoom Controls -->
            <div class="absolute bottom-5 left-5 z-10 flex flex-col bg-white border border-slate-200 rounded-xl shadow-md p-1 space-y-1">
                <button id="btnZoomIn" class="p-2 w-8 h-8 rounded-lg hover:bg-slate-100 text-slate-700 flex items-center justify-center transition" title="放大">
                    <i class="fa-solid fa-plus text-xs"></i>
                </button>
                <button id="btnZoomReset" class="p-2 w-8 h-8 rounded-lg hover:bg-slate-100 text-slate-700 flex items-center justify-center font-mono text-xs font-bold transition" title="重置缩放">
                    100%
                </button>
                <button id="btnZoomOut" class="p-2 w-8 h-8 rounded-lg hover:bg-slate-100 text-slate-700 flex items-center justify-center transition" title="缩小">
                    <i class="fa-solid fa-minus text-xs"></i>
                </button>
            </div>

            <!-- SVG Render Target -->
            <div id="canvasContainer" class="w-full h-full flex items-center justify-center transform-gpu origin-center">
                <svg id="sequenceSvg" xmlns="http://www.w3.org/2000/svg" class="w-full h-full min-w-[1500px] min-h-[1550px]">
                    <!-- SVG elements dynamically generated by JS renderer -->
                </svg>
            </div>
        </main>

        <!-- Sidebar Panel for Inspector & Step Code Editor -->
        <aside id="sidebar" class="w-80 bg-white border-l border-slate-200 flex flex-col transition-all duration-300 shrink-0 z-10 shadow-sm hidden">

            <!-- Sidebar Header Tabs -->
            <div class="border-b border-slate-200 flex text-xs font-medium">
                <button id="tabStepsBtn" class="flex-1 py-3 border-b-2 border-slate-900 font-bold text-slate-900 flex items-center justify-center space-x-1.5">
                    <i class="fa-solid fa-list-check"></i>
                    <span>流程解析</span>
                </button>
                <button id="tabMermaidBtn" class="flex-1 py-3 border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center justify-center space-x-1.5">
                    <i class="fa-solid fa-code"></i>
                    <span>Mermaid 代码</span>
                </button>
            </div>

            <!-- Tab Content 1: Step Inspector -->
            <div id="tabStepsContent" class="flex-1 overflow-y-auto p-4 space-y-4">
                <div>
                    <h4 class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2">交互步骤指引</h4>
                    <div class="space-y-2" id="stepsListContainer">
                        <!-- Dynamic Steps Rendered Here -->
                    </div>
                </div>

                <div class="pt-3 border-t border-slate-200">
                    <h4 class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2">系统实体 (Participants)</h4>
                    <div class="space-y-1.5 text-xs">
                        <div class="flex items-center justify-between p-2 rounded-lg bg-slate-50 border border-slate-100">
                            <span class="font-medium text-slate-700">HIS等业务系统</span>
                            <span class="text-[10px] bg-slate-200 text-slate-600 px-1.5 py-0.5 rounded">发起方</span>
                        </div>
                        <div class="flex items-center justify-between p-2 rounded-lg bg-slate-50 border border-slate-100">
                            <span class="font-medium text-slate-700">省医保开放平台</span>
                            <span class="text-[10px] bg-slate-200 text-slate-700 px-1.5 py-0.5 rounded">网关与接口枢纽</span>
                        </div>
                        <div class="flex items-center justify-between p-2 rounded-lg bg-slate-50 border border-slate-100">
                            <span class="font-medium text-slate-700">省医保患者一屏看</span>
                            <span class="text-[10px] bg-slate-200 text-slate-700 px-1.5 py-0.5 rounded">目标服务</span>
                        </div>
                        <div class="flex items-center justify-between p-2 rounded-lg bg-slate-50 border border-slate-100">
                            <span class="font-medium text-slate-700">省医保用户中心</span>
                            <span class="text-[10px] bg-slate-200 text-slate-700 px-1.5 py-0.5 rounded">鉴权服务</span>
                        </div>
                        <div class="flex items-center justify-between p-2 rounded-lg bg-slate-50 border border-slate-100">
                            <span class="font-medium text-slate-700">常州影像检验调阅</span>
                            <span class="text-[10px] bg-slate-200 text-slate-700 px-1.5 py-0.5 rounded">影像集成</span>
                        </div>
                        <div class="flex items-center justify-between p-2 rounded-lg bg-slate-50 border border-slate-100">
                            <span class="font-medium text-slate-700">常州用户中心</span>
                            <span class="text-[10px] bg-slate-200 text-slate-700 px-1.5 py-0.5 rounded">鉴权服务</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tab Content 2: Mermaid / Source Export -->
            <div id="tabMermaidContent" class="flex-1 overflow-y-auto p-4 hidden flex-col space-y-3">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-semibold text-slate-700">Mermaid.js 代码</span>
                    <button id="btnCopyMermaid" class="text-xs text-sky-600 hover:text-sky-700 font-medium flex items-center space-x-1">
                        <i class="fa-regular fa-copy"></i>
                        <span>复制代码</span>
                    </button>
                </div>
                <textarea id="mermaidTextarea" class="w-full flex-1 bg-slate-900 text-emerald-400 font-mono text-[11px] p-3 rounded-xl focus:outline-none border border-slate-800 leading-relaxed resize-none" readonly></textarea>
            </div>
        </aside>
    </div>

    <!-- Hidden Canvas for PNG Export -->
    <canvas id="exportCanvas" class="hidden"></canvas>

    <script>
        const sequenceData = {
            title: "前置流程：医疗机构已在省医保开放平台完成机构注册与应用注册",
            participants: [
                { id: 'his', name: 'HIS等业务系统', x: 120 },
                { id: 'openPlatform', name: '省医保开放平台', x: 340 },
                { id: 'patientView', name: '省医保患者一屏看', x: 580 },
                { id: 'userCenter', name: '省医保用户中心', x: 800 },
                { id: 'pacsView', name: '常州影像检验调阅', x: 1040 },
                { id: 'czUserCenter', name: '常州用户中心', x: 1280 }
            ],
            groups: [
                {
                    id: 'security',
                    label: '安全管控',
                    topY: 140,
                    bottomY: 310,
                    innerOpt: {
                        label: '可选流程',
                        topY: 195,
                        bottomY: 300
                    }
                },
                {
                    id: 'business',
                    label: '患者一屏看调阅',
                    topY: 325,
                    bottomY: 880
                },
                {
                    id: 'pacsSecurity',
                    label: '常州影像检验调阅',
                    topY: 805,
                    bottomY: 1390,
                    innerOpt: {
                        label: '可选流程',
                        topY: 940,
                        bottomY: 1045
                    }
                }
            ],
            steps: [
                { id: 0, type: 'self', from: 'his', to: 'his', text: '判断省医保开放平台 X-TOKEN 是否存在，是否过期', y: 165, note: '安全预检：业务系统检查本地 Key 缓存状态' },
                { id: 1, type: 'request', from: 'his', to: 'openPlatform', text: '请求省医保开放平台 X-TOKEN', y: 220, dashed: false, note: '可选流程：当 Token 缺失或过期时向省医保开放平台发起鉴权请求' },
                { id: 2, type: 'response', from: 'openPlatform', to: 'his', text: '返回省医保开放平台 X-TOKEN', y: 270, dashed: true, note: '省医保开放平台验证凭证后颁发有效的临时 Token' },
                { id: 3, type: 'request', from: 'his', to: 'openPlatform', text: '1. 请求获取URL（携带医生、患者等参数）', y: 355, dashed: false, note: '业务步骤 1：HIS 通过网关请求获取 URL，携带医生患者参数' },
                { id: 4, type: 'request', from: 'openPlatform', to: 'patientView', text: '2. 省医保开放平台转发请求至省医保患者一屏看', y: 395, dashed: false, note: '业务步骤 2：省医保开放平台转发获取 URL 请求' },
                { id: 5, type: 'request', from: 'patientView', to: 'userCenter', text: '3. 调省医保用户中心进行医生鉴权', y: 435, dashed: false, note: '业务步骤 3：省医保开放平台转发后，省医保患者一屏看向省医保用户中心发起医生鉴权；无账号时创建数据', style: 'color: #dc2626' },
                { id: 6, type: 'response', from: 'userCenter', to: 'patientView', text: '4. 返回鉴权结果', y: 480, dashed: true, note: '业务步骤 4：返回鉴权结果；账号异常时提示' },
                { id: 7, type: 'response', from: 'patientView', to: 'his', text: '5. 鉴权通过后返回URL（账号异常时提示）', y: 530, dashed: true, note: '业务步骤 5：鉴权没问题后才返回 URL，账号异常时给出提示' },
                { id: 8, type: 'self', from: 'his', to: 'his', text: '6. 打开URL', y: 580, note: '业务步骤 6：HIS 打开对应链接' },
                { id: 9, type: 'request', from: 'his', to: 'patientView', text: '7. 跳转携带医生、患者信息跳转url', y: 625, dashed: false, note: '业务步骤 7：携带医生与患者信息跳转' },
                { id: 10, type: 'response', from: 'patientView', to: 'his', text: '8. 呈现省医保患者一屏看页面（未授权状态）', y: 670, dashed: true, note: '业务步骤 8：呈现未授权状态页面给 HIS' },
                { id: 11, type: 'request', from: 'his', to: 'patientView', text: '9. HIS等业务系统进行患者/医生授权', y: 710, dashed: false, note: '业务步骤 9：HIS 完成授权操作' },
                { id: 12, type: 'self', from: 'patientView', to: 'patientView', text: '10. 授权通过后打开省医保患者一屏看页面', y: 755, note: '业务步骤 10：授权通过后正式打开页面' },
                { id: 13, type: 'self', from: 'patientView', to: 'patientView', text: '11. 触发查询医保健康档案数据（影像、检验、病理）', y: 805, note: '业务步骤 11：省医保患者一屏看触发查询数据' },
                { id: 14, type: 'note', from: 'patientView', to: 'patientView', text: '12. 前置流程：省医保患者一屏看已在常州医保开放平台完成应用注册', y: 860, note: '前置流程：省医保患者一屏看已在常州医保开放平台完成应用注册', style: 'color: #dc2626' },
                { id: 15, type: 'self', from: 'patientView', to: 'patientView', text: '判断省医保开放平台 X-TOKEN 是否存在，是否过期', y: 920, note: '影像调阅前置安全预检：检查调阅凭证' },
                { id: 16, type: 'request', from: 'patientView', to: 'openPlatform', text: '请求省医保开放平台 X-TOKEN', y: 975, dashed: false, note: '可选流程：影像调阅请求凭证' },
                { id: 17, type: 'response', from: 'openPlatform', to: 'patientView', text: '返回省医保开放平台 X-TOKEN', y: 1020, dashed: true, note: '颁发调阅临时 Token' },
                { id: 18, type: 'request', from: 'patientView', to: 'openPlatform', text: '13. 请求获取影像检验调阅URL（携带医生、患者等参数）', y: 1080, dashed: false, note: '业务步骤 13：请求影像检验调阅URL' },
                { id: 19, type: 'request', from: 'openPlatform', to: 'pacsView', text: '14. 省医保开放平台转发请求至常州影像检验调阅服务', y: 1125, dashed: false, note: '业务步骤 14：网关转发至影像系统' },
                { id: 20, type: 'request', from: 'pacsView', to: 'czUserCenter', text: '15. 调常州用户中心进行医生鉴权', y: 1175, dashed: false, note: '业务步骤 15：常州影像检验调阅向常州用户中心发起医生鉴权；无账号时创建数据', style: 'color: #dc2626' },
                { id: 21, type: 'response', from: 'czUserCenter', to: 'pacsView', text: '16. 返回鉴权结果', y: 1220, dashed: true, note: '业务步骤 16：常州用户中心返回鉴权结果；账号异常时提示' },
                { id: 22, type: 'response', from: 'pacsView', to: 'patientView', text: '17. 鉴权通过后返回URL（账号异常时提示）', y: 1265, dashed: true, note: '业务步骤 17：鉴权通过后返回URL，账号异常时给出提示' },
                { id: 23, type: 'self', from: 'patientView', to: 'patientView', text: '18. 在页面内部嵌入打开', y: 1315, note: '业务步骤 18：省医保患者一屏看内嵌打开影像检验页面' },
                { id: 24, type: 'request', from: 'patientView', to: 'pacsView', text: '19. 直接打开影像检验调阅且透传授权状态', y: 1360, dashed: false, note: '业务步骤 19：患者一屏看直接打开影像检验调阅，透传授权状态' }
            ],
            activations: [
                { participant: 'his', startY: 150, endY: 290 },
                { participant: 'openPlatform', startY: 210, endY: 290 },
                { participant: 'his', startY: 340, endY: 720 },
                { participant: 'openPlatform', startY: 340, endY: 410 },
                { participant: 'patientView', startY: 385, endY: 1370 },
                { participant: 'userCenter', startY: 425, endY: 490 },
                { participant: 'openPlatform', startY: 965, endY: 1035 },
                { participant: 'openPlatform', startY: 1070, endY: 1140 },
                { participant: 'pacsView', startY: 1115, endY: 1375 },
                { participant: 'czUserCenter', startY: 1165, endY: 1235 }
            ]
        };

        const classicTheme = {
            bg: '#ffffff',
            headerFill: '#ffffff',
            headerStroke: '#000000',
            headerText: '#000000',
            lifeline: '#333333',
            lineColor: '#000000',
            activationFill: '#ffffff',
            activationStroke: '#000000',
            bracketColor: '#000000',
            groupFill: 'rgba(240, 240, 240, 0.4)',
            groupStroke: '#94a3b8',
            textColor: '#000000',
            topNoteFill: '#ffffff',
            topNoteStroke: '#000000',
            topNoteText: '#000000'
        };

        let currentStep = -1;
        let zoomLevel = 1.0;
        let panX = 0;
        let panY = 0;
        let isDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;

        const svg = document.getElementById('sequenceSvg');
        const viewport = document.getElementById('canvasViewport');
        const container = document.getElementById('canvasContainer');

        function renderDiagram() {
            const width = 1500;
            const height = 1550;

            svg.setAttribute('viewBox', `-120 0 ${width + 120} ${height}`);

            let svgHtml = `
            <defs>
                <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                    <path d="M 0 1 L 10 5 L 0 9 z" fill="${classicTheme.lineColor}" />
                </marker>
                <marker id="arrowhead-active" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                    <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
                </marker>
            </defs>

            <rect x="-120" width="${width + 120}" height="${height}" fill="${classicTheme.bg}" />
            `;

            // 1. Top Note Banner
            svgHtml += `
            <g class="top-banner">
                <rect x="70" y="25" width="1350" height="42" fill="${classicTheme.topNoteFill}" stroke="${classicTheme.topNoteStroke}" stroke-width="1.2"/>
                <text x="735" y="51" text-anchor="middle" font-size="13" font-weight="500" fill="${classicTheme.topNoteText}">
                    ${sequenceData.title}
                </text>
                <line x1="120" y1="67" x2="120" y2="1380" stroke="${classicTheme.lifeline}" stroke-dasharray="4,4" />
                <line x1="340" y1="67" x2="340" y2="1380" stroke="${classicTheme.lifeline}" stroke-dasharray="4,4" />
                <line x1="580" y1="67" x2="580" y2="1380" stroke="${classicTheme.lifeline}" stroke-dasharray="4,4" />
                <line x1="800" y1="67" x2="800" y2="1380" stroke="${classicTheme.lifeline}" stroke-dasharray="4,4" />
                <line x1="1040" y1="67" x2="1040" y2="1380" stroke="${classicTheme.lifeline}" stroke-dasharray="4,4" />
            </g>`;

            // 2. Participant Headers
            sequenceData.participants.forEach(p => {
                svgHtml += `
                <g class="participant-header" transform="translate(${p.x - 65}, 85)">
                    <rect width="130" height="38" fill="${classicTheme.headerFill}" stroke="${classicTheme.headerStroke}" stroke-width="1.2"/>
                    <text x="65" y="23" text-anchor="middle" font-size="11" font-weight="bold" fill="${classicTheme.headerText}">
                        ${p.name}
                    </text>
                </g>
                <line x1="${p.x}" y1="123" x2="${p.x}" y2="1380" stroke="${classicTheme.lifeline}" stroke-width="1.2" stroke-dasharray="5,5" />
                `;
            });

            // 3. Left Brackets & Groups
            sequenceData.groups.forEach(g => {
                const xBracket = 40;
                const h = g.bottomY - g.topY;
                const midY = g.topY + h / 2;

                const bracePath = `
                    M ${xBracket + 15} ${g.topY}
                    C ${xBracket + 5} ${g.topY}, ${xBracket + 5} ${midY - 10}, ${xBracket} ${midY}
                    C ${xBracket + 5} ${midY + 10}, ${xBracket + 5} ${g.bottomY}, ${xBracket + 15} ${g.bottomY}
                `;

                svgHtml += `
                <g class="group-brace">
                    <path d="${bracePath}" fill="none" stroke="${classicTheme.bracketColor}" stroke-width="1.8" />
                    <text x="${xBracket - 6}" y="${midY + 4}" text-anchor="end" font-size="12" font-weight="bold" fill="${classicTheme.textColor}">
                        ${g.label}
                    </text>
                </g>
                `;

                if (g.innerOpt) {
                    const opt = g.innerOpt;
                    const rectX = (g.id === 'pacsSecurity') ? 300 : 80;
                    const rectWidth = (g.id === 'pacsSecurity') ? 340 : 320;
                    svgHtml += `
                    <g class="optional-box">
                        <rect x="${rectX}" y="${opt.topY}" width="${rectWidth}" height="${opt.bottomY - opt.topY}" fill="${classicTheme.groupFill}" stroke="${classicTheme.groupStroke}" stroke-dasharray="4,4" stroke-width="1" />
                        <rect x="${rectX}" y="${opt.topY}" width="50" height="35" fill="${classicTheme.bg}" stroke="${classicTheme.groupStroke}" stroke-width="1"/>
                        <text x="${rectX + 6}" y="${opt.topY + 16}" font-size="10" font-weight="bold" fill="${classicTheme.textColor}">可选</text>
                        <text x="${rectX + 6}" y="${opt.topY + 28}" font-size="10" font-weight="bold" fill="${classicTheme.textColor}">流程</text>
                    </g>
                    `;
                }
            });

            // 4. Lifeline Activations
            sequenceData.activations.forEach(act => {
                const part = sequenceData.participants.find(p => p.id === act.participant);
                if (!part) return;

                svgHtml += `
                <rect x="${part.x - 6}" y="${act.startY}" width="12" height="${act.endY - act.startY}"
                      fill="${classicTheme.activationFill}" stroke="${classicTheme.activationStroke}" stroke-width="1.2"/>
                `;
            });

            // 5. Steps & Arrows
            sequenceData.steps.forEach((step, index) => {
                const fromPart = sequenceData.participants.find(p => p.id === step.from);
                const toPart = sequenceData.participants.find(p => p.id === step.to);
                const isActive = (currentStep === index);

                const lineClass = step.dashed ? 'stroke-dasharray="5,4"' : '';
                const strokeColor = isActive ? '#0284c7' : classicTheme.lineColor;
                const textColor = isActive ? '#0284c7' : (step.style && step.style.match(/color:s*(#[0-9a-fA-F]+)/) ? step.style.match(/color:s*(#[0-9a-fA-F]+)/)[1] : classicTheme.textColor);
                const strokeWidth = isActive ? '2.5' : '1.5';
                const markerEnd = isActive ? 'url(#arrowhead-active)' : 'url(#arrowhead)';

                svgHtml += `<g class="step-group cursor-pointer" onclick="selectStep(${index})">`;

                if (step.type === 'note') {
                        const noteX = 70;
                        const noteW = 1350;
                        const noteH = 36;
                        svgHtml += `
                            <rect x="${noteX}" y="${step.y - 10}" width="${noteW}" height="${noteH}" fill="${classicTheme.topNoteFill}" stroke="${classicTheme.topNoteStroke}" stroke-width="1.2"/>
                            <text x="${noteX + noteW / 2}" y="${step.y + 13}" text-anchor="middle" font-size="13" font-weight="500" fill="${classicTheme.topNoteText}">
                                ${step.text}
                            </text>
                        `;
                    } else if (step.type === 'self') {
                    const startX = fromPart.x + 6;
                    const loopWidth = 35;
                    const loopHeight = 28;

                    const path = `
                        M ${startX} ${step.y}
                        L ${startX + loopWidth} ${step.y}
                        L ${startX + loopWidth} ${step.y + loopHeight}
                        L ${startX + 2} ${step.y + loopHeight}
                    `;

                    svgHtml += `
                        <path d="${path}" fill="none" stroke="${strokeColor}" stroke-width="${strokeWidth}" marker-end="${markerEnd}" />
                        <text x="${startX + loopWidth + 10}" y="${step.y + 17}" font-size="11" font-weight="${isActive ? 'bold' : 'normal'}" fill="${textColor}">
                            ${step.text}
                        </text>
                    `;
                } else {
                    const isRight = toPart.x > fromPart.x;
                    const startX = isRight ? fromPart.x + 6 : fromPart.x - 6;
                    const endX = isRight ? toPart.x - 6 : toPart.x + 6;
                    const midX = (startX + endX) / 2;

                    svgHtml += `
                        <line x1="${startX}" y1="${step.y}" x2="${endX}" y2="${step.y}"
                              stroke="${strokeColor}" stroke-width="${strokeWidth}" ${lineClass}
                              marker-end="${markerEnd}" />
                        <text x="${midX}" y="${step.y - 7}" text-anchor="middle" font-size="11" font-weight="${isActive ? 'bold' : 'normal'}" fill="${textColor}">
                            ${step.text}
                        </text>
                    `;
                }

                svgHtml += `</g>`;
            });

            svg.innerHTML = svgHtml;
        }

        function renderStepList() {
            const container = document.getElementById('stepsListContainer');
            let html = '';

            sequenceData.steps.forEach((step, idx) => {
                const isActive = (currentStep === idx);
                const activeClass = isActive
                    ? 'bg-sky-50 border-sky-300 ring-2 ring-sky-500/20'
                    : 'bg-white border-slate-200 hover:bg-slate-50';

                html += `
                <div onclick="selectStep(${idx})" class="p-2.5 rounded-xl border ${activeClass} cursor-pointer transition flex items-start space-x-2.5">
                    <span class="inline-flex items-center justify-center ${isActive ? 'bg-sky-600 text-white' : 'bg-slate-100 text-slate-600'} font-bold rounded-lg w-5 h-5 text-xs shrink-0 mt-0.5">
                        ${idx + 1}
                    </span>
                    <div class="flex-1 min-w-0">
                        <div class="text-xs font-semibold ${isActive ? 'text-sky-900' : 'text-slate-800'} truncate">
                            ${step.text}
                        </div>
                        <div class="text-[11px] text-slate-500 mt-1 leading-normal">
                            ${step.note}
                        </div>
                    </div>
                </div>
                `;
            });

            container.innerHTML = html;
        }

        function selectStep(stepIdx) {
            currentStep = (currentStep === stepIdx) ? -1 : stepIdx;
            renderDiagram();
            renderStepList();
        }

        function applyTransform() {
            container.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomLevel})`;
            document.getElementById('btnZoomReset').innerText = `${Math.round(zoomLevel * 100)}%`;
        }

        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? -0.08 : 0.08;
            zoomLevel = Math.min(Math.max(0.5, zoomLevel + delta), 2.5);
            applyTransform();
        });

        viewport.addEventListener('mousedown', (e) => {
            if (e.target.closest('button')) return;
            isDragging = true;
            dragStartX = e.clientX - panX;
            dragStartY = e.clientY - panY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            panX = e.clientX - dragStartX;
            panY = e.clientY - dragStartY;
            applyTransform();
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        document.getElementById('btnZoomIn').onclick = () => { zoomLevel = Math.min(2.5, zoomLevel + 0.15); applyTransform(); };
        document.getElementById('btnZoomOut').onclick = () => { zoomLevel = Math.max(0.5, zoomLevel - 0.15); applyTransform(); };
        document.getElementById('btnZoomReset').onclick = () => { zoomLevel = 1.0; panX = 0; panY = 0; applyTransform(); };

        function exportAsPNG() {
            const svgData = new XMLSerializer().serializeToString(svg);
            const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
            const URL = window.URL || window.webkitURL || window;
            const blobURL = URL.createObjectURL(svgBlob);

            const image = new Image();
            image.onload = () => {
                const canvas = document.getElementById('exportCanvas');
                canvas.width = 1620 * 2;
                canvas.height = 1550 * 2;
                const context = canvas.getContext('2d');
                context.scale(2, 2);
                context.drawImage(image, 0, 0);

                const png = canvas.toDataURL('image/png');
                const downloadLink = document.createElement('a');
                downloadLink.href = png;
                downloadLink.download = `患者档案"一屏看"交互时序图.png`;
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);
            };
            image.src = blobURL;
        }

        const sidebar = document.getElementById('sidebar');
        document.getElementById('btnToggleSidebar').onclick = () => {
            sidebar.classList.toggle('hidden');
        };

        const tabStepsBtn = document.getElementById('tabStepsBtn');
        const tabMermaidBtn = document.getElementById('tabMermaidBtn');
        const tabStepsContent = document.getElementById('tabStepsContent');
        const tabMermaidContent = document.getElementById('tabMermaidContent');

        tabStepsBtn.onclick = () => {
            tabStepsBtn.className = "flex-1 py-3 border-b-2 border-slate-900 font-bold text-slate-900 flex items-center justify-center space-x-1.5";
            tabMermaidBtn.className = "flex-1 py-3 border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center justify-center space-x-1.5";
            tabStepsContent.classList.remove('hidden');
            tabMermaidContent.classList.add('hidden');
            tabMermaidContent.classList.remove('flex');
        };

        tabMermaidBtn.onclick = () => {
            tabMermaidBtn.className = "flex-1 py-3 border-b-2 border-slate-900 font-bold text-slate-900 flex items-center justify-center space-x-1.5";
            tabStepsBtn.className = "flex-1 py-3 border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center justify-center space-x-1.5";
            tabMermaidContent.classList.remove('hidden');
            tabMermaidContent.classList.add('flex');
            tabStepsContent.classList.add('hidden');
            document.getElementById('mermaidTextarea').value = generateMermaidCode();
        };

        document.getElementById('btnCopyMermaid').onclick = () => {
            const code = document.getElementById('mermaidTextarea').value;
            const textarea = document.createElement('textarea');
            textarea.value = code;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);

            const btn = document.getElementById('btnCopyMermaid');
            btn.innerHTML = `<i class="fa-solid fa-check text-emerald-600"></i><span class="text-emerald-600">已复制!</span>`;
            setTimeout(() => {
                btn.innerHTML = `<i class="fa-regular fa-copy"></i><span>复制代码</span>`;
            }, 2000);
        };

        document.getElementById('btnExportSVG').onclick = exportAsPNG;

        window.onload = () => {
            renderDiagram();
            renderStepList();
            document.getElementById('mermaidTextarea').value = generateMermaidCode();
        };
    </script>
