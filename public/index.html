    <style>
      #app {
        position: relative;
        z-index: 1;
      }
      .hack-dom{
        display: none;
        position: absolute;
        top: 0;
        color: rgba(0, 0, 0, 0.65);
        width: 500px;
        padding: 16px 40px 16px 16px;
        right: 16px;
        top: 16px;

        position: absolute;
        top: 10px;
        right: 10px;
        width: 22px;
        height: 22px;
        cursor: pointer;
      }
      .skeleton-screen {
        position: absolute;
        width: 100%;
        top: 0;
        left: 0;
        display: none;
      }
      .ske-header {
        padding: 0 32px;
        background: #fff;
        overflow: hidden;
      }
      .skeleton-screen .left{

        width: 500px;
      }

        width: 30px;
        float: left;
        display: inline-block;
      }
      .skeleton-screen .menu {

      }
      .skeleton-screen .title{

        font-weight: bold;
        color: #333;
        height: 64px;
        line-height: 64px;
        margin-left: 12px;
        float: left;
        width: 420px;
      }
      .skeleton-screen .menu {

        float: left;
      }
      .skeleton-screen .menu span{
        display: inline-block;
        font-size: 16px;
        color: rgba(0, 0, 0, 0.65);
        height: 64px;
        line-height: 64px;
        padding: 0 24px;
        cursor: pointer;
      }
      .skeleton-screen .menu span:hover{
        color: #1890ff;
      }
      .ske-content{
        padding: 64px 32px 40px 32px;
        background-color: #f3f5f7;
      }
      .ske-content-inner{
        background-color: #fff;
        padding: 48px 0;
        position: relative;
      }
      .ske-content-tab {
        position: absolute;
        top: -35px;
        left: 0;
        padding: 8px 16px;
        background-color: #fff;
        color: #333;
      }
      .ske-content-hander{
        text-align: center;
      }
      .ske-content-hander .ant-input{
        width: 240px;
        margin-right: 8px;
      }
      .ske-content-tip{
        margin-top: 12px;
      }
      .ske-content-tip span{
        color: rgba(0, 0, 0, 0.45);
        font-size: 14px;
        margin-left: -114px;
      }
    </style>

    <div id="app">
      <style>
        html[data-theme='dark'] .app-loading {
          background-color: #2c344a;
        }

        html[data-theme='dark'] .app-loading .app-loading-title {
          color: rgba(255, 255, 255, 0.85);
        }

        .app-loading {
          display: flex;
          width: 100%;
          height: 100vh;
          justify-content: center;
          align-items: center;
          flex-direction: column;
          background-color: #f4f7f9;
        }

        .app-loading .app-loading-wrap {
          position: absolute;
          top: 50%;
          left: 50%;
          display: flex;
          -webkit-transform: translate3d(-50%, -50%, 0);
          transform: translate3d(-50%, -50%, 0);
          justify-content: center;
          align-items: center;
          flex-direction: column;
        }

        .app-loading .dots {
          display: flex;
          padding: 98px;
          justify-content: center;
          align-items: center;
        }

        .app-loading .app-loading-title {
          display: flex;
          margin-top: 30px;
          font-size: 30px;
          color: rgba(0, 0, 0, 0.85);
          justify-content: center;
          align-items: center;
        }

        .app-loading .app-loading-logo {
          display: block;
          width: 90px;
          margin: 0 auto;
          margin-bottom: 20px;
        }

        .dot {
          position: relative;
          display: inline-block;
          width: 48px;
          height: 48px;
          margin-top: 30px;
          font-size: 32px;
          transform: rotate(45deg);
          box-sizing: border-box;
          animation: antRotate 1.2s infinite linear;
        }

        .dot i {
          position: absolute;
          display: block;
          width: 20px;
          height: 20px;
          background-color: #0065cc;
          border-radius: 100%;
          opacity: 0.3;
          transform: scale(0.75);
          animation: antSpinMove 1s infinite linear alternate;
          transform-origin: 50% 50%;
        }

        .dot i:nth-child(1) {
          top: 0;
          left: 0;
        }

        .dot i:nth-child(2) {
          top: 0;
          right: 0;
          -webkit-animation-delay: 0.4s;
          animation-delay: 0.4s;
        }

        .dot i:nth-child(3) {
          right: 0;
          bottom: 0;
          -webkit-animation-delay: 0.8s;
          animation-delay: 0.8s;
        }

        .dot i:nth-child(4) {
          bottom: 0;
          left: 0;
          -webkit-animation-delay: 1.2s;
          animation-delay: 1.2s;
        }
        @keyframes antRotate {
          to {
            -webkit-transform: rotate(405deg);
            transform: rotate(405deg);
          }
        }
        @-webkit-keyframes antRotate {
          to {
            -webkit-transform: rotate(405deg);
            transform: rotate(405deg);
          }
        }
        @keyframes antSpinMove {
          to {
            opacity: 1;
          }
        }
        @-webkit-keyframes antSpinMove {
          to {
            opacity: 1;
          }
        }
      </style>

      <div class="app-loading">
        <div class="app-loading-wrap">
          <div class="app-loading-dots">
            <span class="dot dot-spin"><i></i><i></i><i></i><i></i></span>
          </div>
        </div>
      </div>
